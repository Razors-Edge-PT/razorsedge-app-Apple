name: localtest222
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number isstop used as the build suffix.
version: 1.1.0+39

environment:
  sdk: '>=3.4.4 <4.0.0'

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  firebase_auth: ^5.1.3
  firebase_core: ^3.5.0
  firebase_database: ^11.0.4
  cloud_firestore: ^5.2.0
  table_calendar: ^3.0.9
  intl: 0.20.2   # ⬅️ Downgraded to match Flutter SDK
  google_sign_in: ^6.1.4
  uuid: ^4.2.2
  shared_preferences: ^2.5.3
  collection: ^1.17.1
  string_similarity: ^2.0.0
  fl_chart: ^0.65.0
  device_info_plus: ^10.1.0
  image_picker: ^1.1.2 # or latest
  firebase_storage: ^12.3.0
  cloud_functions: ^5.0.4
  crypto: ^3.0.3
  path_provider: ^2.1.3
  firebase_app_check: ^0.3.2+7
  flutter_cache_manager: ^3.3.2
  scrollable_positioned_list: ^0.3.8
  isar_community: 3.3.2
  isar_community_flutter_libs: 3.3.2
  chewie: ^1.7.5
  flutter_image_compress: ^2.3.0
  lottie: ^3.1.0
  flutter_svg: ^2.0.9
  url_launcher: ^6.0.0  # or whatever current version you use
  flutter_colorpicker: ^1.1.0
  in_app_purchase: ^3.2.0
  facebook_app_events: ^0.27.2


  flutter:
    sdk: flutter

  google_fonts: ^6.1.0
  provider: ^6.1.1

  flutter_localizations:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.6
  file_picker: ^10.3.1
  video_player: ^2.10.0
  visibility_detector: ^0.4.0
  video_thumbnail: ^0.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.4
  flutter_lints: ^5.0.0  # keep ONLY here, under dev_dependencies
  build_runner: ">=2.4.13 <2.15.0"
  isar_community_generator: 3.3.2

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/Logo_beta.png
  adaptive_icon_foreground: "assets/icon/Logo_beta_foreground.png"
  adaptive_icon_background: "#000000"

flutter_native_splash:
  color: "#0B0B0B"

  # Used on Android 11 and below (can be wide)
  image: assets/branding/GL_Navy.png   # (no spaces in the filename)

  android_12:
    image: assets/branding/splash_android12_1152.png   # padded square icon

    icon_background_color: "#0B0B0B"

  android: true
  ios: false


