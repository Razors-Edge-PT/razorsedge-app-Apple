// Top-level build file for the Android project.
// Plugins are declared in settings.gradle (AGP/Kotlin/Google Services).
// Keep repos here for resolution across all subprojects.

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"

// Normalize subproject build dirs and ensure app is evaluated first.
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
    project.evaluationDependsOn(":app")
}

// --- Enforce SDK levels for EVERY Android library (e.g., isar_flutter_libs)
subprojects { sub ->
    sub.plugins.withId("com.android.library") {
        def androidExt = sub.extensions.findByName("android")
        if (androidExt != null) {
            if (androidExt.hasProperty("compileSdk")) androidExt.compileSdk = 35
            if (androidExt.hasProperty("compileSdkVersion")) androidExt.compileSdkVersion = 35
            if (androidExt.hasProperty("buildToolsVersion")) androidExt.buildToolsVersion = "35.0.0"

            if (androidExt.hasProperty("defaultConfig") && androidExt.defaultConfig != null) {
                androidExt.defaultConfig.minSdk = 23
                androidExt.defaultConfig.targetSdk = 35
            }

            def ns = (androidExt.hasProperty("namespace") && androidExt.namespace) ? androidExt.namespace : "(no namespace)"
            println("🔧 ${sub.path} → namespace=${ns}, compileSdk=${androidExt.compileSdk}")
        }
    }
}

// --- PATCH: fix isar_flutter_libs manifest/namespace + lStar ---
// Force consistent AndroidX Core + AppCompat + Material everywhere
subprojects {
    project.configurations.all {
        resolutionStrategy.force(
                "androidx.core:core:1.13.1",
                "androidx.appcompat:appcompat:1.6.1",
                "com.google.android.material:material:1.11.0"
        )
    }
}



// Force consistent AndroidX Core everywhere
subprojects { sub ->
    sub.configurations.all {
        resolutionStrategy.force "androidx.core:core:1.13.1"
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
