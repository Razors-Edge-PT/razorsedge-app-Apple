plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"   // <- was "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
}

def flutterVersionCode = project.hasProperty('flutter.versionCode') ? project.getProperty('flutter.versionCode') : "1"
def flutterVersionName = project.hasProperty('flutter.versionName') ? project.getProperty('flutter.versionName') : "1.0.0"

android {
    namespace = "com.goodlift.razorsedge"
    compileSdk = 35                     // <- set explicitly (fixes lStar error)
    ndkVersion = flutter.ndkVersion

    defaultConfig {
        applicationId = "com.goodlift.razorsedge"
        minSdk = 23                     // 23+ recommended; if you must keep 30, it’s OK
        targetSdk = 35
        versionCode = flutterVersionCode.toInteger()
        versionName = flutterVersionName
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = "17" }

    buildTypes {
        release {
            signingConfig = signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    implementation platform("com.google.firebase:firebase-bom:32.7.3")
    implementation "com.google.firebase:firebase-analytics"
    implementation "com.google.firebase:firebase-firestore"

    // ✅ Force AndroidX Core into all build variants
    implementation "androidx.core:core:1.13.1"
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "com.google.android.material:material:1.11.0"
}

project.ext.googleServicesJsonFile = file("google-services.json")
