
plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"   // <- was "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
}

// Version comes from pubspec.yaml. `flutter build` writes it into
// android/local.properties as flutter.versionName / flutter.versionCode, so
// that file is read FIRST and is the authoritative source.
//
// The previous code only checked project.hasProperty('flutter.versionCode'),
// which the modern dev.flutter.flutter-gradle-plugin never sets. That check was
// always false, so every release silently fell back to the hardcoded literals
// below and shipped 1.7.10+80 no matter what pubspec.yaml said.
def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader -> localProperties.load(reader) }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
    ?: (project.hasProperty('flutter.versionCode') ? project.getProperty('flutter.versionCode') : "89")
def flutterVersionName = localProperties.getProperty('flutter.versionName')
    ?: (project.hasProperty('flutter.versionName') ? project.getProperty('flutter.versionName') : "1.7.19")

// Aurelian bridge caller allowlist (docs/aurelian_bridge.md, "Caller certificates"): SHA-256
// fingerprints of the certificates allowed to sign the Aurelian app that may call the bridge.
// Public identifiers, not secrets. Set per build in android/local.properties (or with -P):
//   aurelian.callerCerts.release=<64 hex>[,<64 hex>]   release builds: NO caller unless set here
//   aurelian.callerCerts.debug=<64 hex>                 debug builds: defaults to the dev machine's
//                                                       debug certificate below
def aurelianCallerCerts = { String key ->
    def raw = (project.findProperty(key) ?: localProperties.getProperty(key) ?: '').toString().trim()
    def certs = raw ? raw.split(',').collect { it.trim().replace(':', '').toLowerCase() }.findAll { it } : []
    certs.each { cert ->
        if (!(cert ==~ /[0-9a-f]{64}/)) {
            throw new GradleException("$key: '$cert' is not a SHA-256 certificate fingerprint")
        }
    }
    return certs.join(',')
}
// Richard's development machine's Android debug certificate (CN=Android Debug). Debug builds only:
// a release build never trusts it unless aurelian.callerCerts.release names it explicitly.
def devAurelianCallerCert = '8e8d2fe3065691c3bbb57485fa3bc9ebde1f9052367201df7c36d9dd13bea763'
def debugAurelianCallerCerts = aurelianCallerCerts('aurelian.callerCerts.debug') ?: devAurelianCallerCert
def releaseAurelianCallerCerts = aurelianCallerCerts('aurelian.callerCerts.release')

android {
    namespace = "com.goodlift.razorsedge"
    compileSdk = 36
    ndkVersion "27.0.12077973"

    defaultConfig {
        applicationId = "com.goodlift.razorsedge"
        minSdkVersion = flutter.minSdkVersion
        targetSdk = 36
        versionCode = flutterVersionCode.toInteger()
        versionName = flutterVersionName
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = "17" }

    buildFeatures {
        buildConfig = true
    }

    // 🔐 Release signing config (matches the keystore you just made)
    signingConfigs {
        release {
            // keystore is in android/app
            storeFile file("goodlift-upload-keystore.jks")
            storePassword "GOODLIFTupload2025"
            keyAlias "upload"
            keyPassword "GOODLIFTupload2025"
        }
    }

    buildTypes {
        debug {
            // default debug signing
            buildConfigField "String", "AURELIAN_CALLER_CERTS", "\"${debugAurelianCallerCerts}\""
        }
        release {
            signingConfig signingConfigs.release
            buildConfigField "String", "AURELIAN_CALLER_CERTS", "\"${releaseAurelianCallerCerts}\""
            minifyEnabled false
            shrinkResources false
        }
    }
}



flutter {
    source = "../.."
}

dependencies {
    // ✅ Force AndroidX Core into all build variants
    implementation "androidx.core:core:1.13.1"
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "com.google.android.material:material:1.11.0"

    // JVM unit tests of the Aurelian voice bridge core (android/app/src/test).
    testImplementation "junit:junit:4.13.2"
}
