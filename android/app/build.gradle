
plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"   // <- was "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
}

// Version comes from pubspec.yaml. `flutter build` writes it into
// android/local.properties as flutter.versionName / flutter.versionCode, so
// that file is read FIRST and is the authoritative source.
//
// The previous code only checked project.hasProperty('flutter.versionCode'),
// which the modern dev.flutter.flutter-gradle-plugin never sets. That check was
// always false, so every release silently fell back to the hardcoded literals
// below and shipped 1.7.10+80 no matter what pubspec.yaml said.
def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader -> localProperties.load(reader) }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
    ?: (project.hasProperty('flutter.versionCode') ? project.getProperty('flutter.versionCode') : "80")
def flutterVersionName = localProperties.getProperty('flutter.versionName')
    ?: (project.hasProperty('flutter.versionName') ? project.getProperty('flutter.versionName') : "1.7.10")

android {
    namespace = "com.goodlift.razorsedge"
    compileSdk = 36
    ndkVersion "27.0.12077973"

    defaultConfig {
        applicationId = "com.goodlift.razorsedge"
        minSdkVersion = flutter.minSdkVersion
        targetSdk = 36
        versionCode = flutterVersionCode.toInteger()
        versionName = flutterVersionName
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = "17" }

    // 🔐 Release signing config (matches the keystore you just made)
    signingConfigs {
        release {
            // keystore is in android/app
            storeFile file("goodlift-upload-keystore.jks")
            storePassword "GOODLIFTupload2025"
            keyAlias "upload"
            keyPassword "GOODLIFTupload2025"
        }
    }

    buildTypes {
        debug {
            // default debug signing
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
        }
    }
}



flutter {
    source = "../.."
}

dependencies {
    // ✅ Force AndroidX Core into all build variants
    implementation "androidx.core:core:1.13.1"
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "com.google.android.material:material:1.11.0"
}
