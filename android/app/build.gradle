
plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services" // ✅ Firebase plugin

}

def flutterVersionCode = project.hasProperty('flutter.versionCode') ? project.getProperty('flutter.versionCode') : "1"
def flutterVersionName = project.hasProperty('flutter.versionName') ? project.getProperty('flutter.versionName') : "1.0.0"


android {
    namespace = "com.razorsedge.pt" // ✅ This matches your applicationId
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId = "com.razorsedge.pt" // ✅ Make sure this matches Firebase setup
        minSdk = 30
        targetSdk = 35
        versionCode = flutterVersionCode.toInteger()
        versionName = flutterVersionName
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    implementation platform('com.google.firebase:firebase-bom:32.7.3') // ✅ BOM manages versions
    implementation 'com.google.firebase:firebase-analytics'           // ✅ You can add more here
    implementation 'com.google.firebase:firebase-firestore'
}

project.ext.googleServicesJsonFile = file("2google-services.json")
// ✅ Do NOT include classpath or apply plugin here anymore:
