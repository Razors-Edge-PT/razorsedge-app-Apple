
plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"   // <- was "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
}

def flutterVersionCode = project.hasProperty('flutter.versionCode') ? project.getProperty('flutter.versionCode') : "37"
def flutterVersionName = project.hasProperty('flutter.versionName') ? project.getProperty('flutter.versionName') : "1.3.7"

android {
    namespace = "com.goodlift.razorsedge"
    compileSdk = 36
    ndkVersion = flutter.ndkVersion

    defaultConfig {
        applicationId = "com.goodlift.razorsedge"
        minSdkVersion = flutter.minSdkVersion
        targetSdk = 36
        versionCode = flutterVersionCode.toInteger()
        versionName = flutterVersionName
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = "17" }

    // 🔐 Release signing config (matches the keystore you just made)
    signingConfigs {
        release {
            // keystore is in android/app
            storeFile file("goodlift-upload-keystore.jks")
            storePassword "GOODLIFTupload2025"
            keyAlias "upload"
            keyPassword "GOODLIFTupload2025"
        }
    }

    buildTypes {
        debug {
            // default debug signing
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
        }
    }
}



flutter {
    source = "../.."
}

dependencies {
    implementation platform("com.google.firebase:firebase-bom:32.7.3")
    implementation "com.google.firebase:firebase-analytics"
    implementation "com.google.firebase:firebase-firestore"

    // ✅ Force AndroidX Core into all build variants
    implementation "androidx.core:core:1.13.1"
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "com.google.android.material:material:1.11.0"
}
