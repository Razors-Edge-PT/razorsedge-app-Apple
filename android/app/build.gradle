
plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"   // <- was "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
}

// Version comes from pubspec.yaml. `flutter build` writes it into
// android/local.properties as flutter.versionName / flutter.versionCode, so
// that file is read FIRST and is the authoritative source.
//
// The previous code only checked project.hasProperty('flutter.versionCode'),
// which the modern dev.flutter.flutter-gradle-plugin never sets. That check was
// always false, so every release silently fell back to the hardcoded literals
// below and shipped 1.7.10+80 no matter what pubspec.yaml said.
def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader -> localProperties.load(reader) }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
    ?: (project.hasProperty('flutter.versionCode') ? project.getProperty('flutter.versionCode') : "89")
def flutterVersionName = localProperties.getProperty('flutter.versionName')
    ?: (project.hasProperty('flutter.versionName') ? project.getProperty('flutter.versionName') : "1.7.19")

// Aurelian bridge caller allowlist (docs/aurelian_bridge.md, "Caller certificates"): SHA-256
// fingerprints of the certificates allowed to sign the Aurelian app that may call the bridge.
// Public identifiers, not secrets.
//
// RELEASE builds always trust exactly APPROVED_AURELIAN_RELEASE_CERTS: the owner-approved signing
// identity of Richard's Aurelian (com.razorsedgesystems.aurelian), a standing requirement of every
// GoodLift Android release (Internal Testing and Production alike). This constant is the single
// source of truth. Rotating it is a deliberate source change: edit it here AND the pinned value in
// AurelianBridgeCoreTest, and update docs/aurelian_bridge.md. A legacy
// aurelian.callerCerts.release property (local.properties or -P) is accepted only when it names
// exactly this set; any other value fails the build instead of silently changing who is trusted.
//
// DEBUG builds: aurelian.callerCerts.debug=<64 hex>[,<64 hex>] if set, else the same certificate.
def APPROVED_AURELIAN_RELEASE_CERTS = '8e8d2fe3065691c3bbb57485fa3bc9ebde1f9052367201df7c36d9dd13bea763'
def aurelianCallerCerts = { String key ->
    def raw = (project.findProperty(key) ?: localProperties.getProperty(key) ?: '').toString().trim()
    def certs = raw ? raw.split(',').collect { it.trim().replace(':', '').toLowerCase() }.findAll { it } : []
    certs.each { cert ->
        if (!(cert ==~ /[0-9a-f]{64}/)) {
            throw new GradleException("$key: '$cert' is not a SHA-256 certificate fingerprint")
        }
    }
    return certs.join(',')
}
def debugAurelianCallerCerts = aurelianCallerCerts('aurelian.callerCerts.debug') ?: APPROVED_AURELIAN_RELEASE_CERTS
def releaseAurelianCallerCerts = APPROVED_AURELIAN_RELEASE_CERTS
def releaseCertsOverride = aurelianCallerCerts('aurelian.callerCerts.release')
if (releaseCertsOverride && releaseCertsOverride.split(',').toList().toSet() != releaseAurelianCallerCerts.split(',').toList().toSet()) {
    throw new GradleException("aurelian.callerCerts.release ($releaseCertsOverride) differs from the approved " +
        "Aurelian release certificate in android/app/build.gradle. Remove the override; rotating the " +
        "certificate is a source change (see docs/aurelian_bridge.md).")
}

android {
    namespace = "com.goodlift.razorsedge"
    compileSdk = 36
    ndkVersion "27.0.12077973"

    defaultConfig {
        applicationId = "com.goodlift.razorsedge"
        minSdkVersion = flutter.minSdkVersion
        targetSdk = 36
        versionCode = flutterVersionCode.toInteger()
        versionName = flutterVersionName
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = "17" }

    buildFeatures {
        buildConfig = true
    }

    // 🔐 Release signing config (matches the keystore you just made)
    signingConfigs {
        release {
            // keystore is in android/app
            storeFile file("goodlift-upload-keystore.jks")
            storePassword "GOODLIFTupload2025"
            keyAlias "upload"
            keyPassword "GOODLIFTupload2025"
        }
    }

    buildTypes {
        debug {
            // default debug signing
            buildConfigField "String", "AURELIAN_CALLER_CERTS", "\"${debugAurelianCallerCerts}\""
        }
        release {
            signingConfig signingConfigs.release
            buildConfigField "String", "AURELIAN_CALLER_CERTS", "\"${releaseAurelianCallerCerts}\""
            minifyEnabled false
            shrinkResources false
        }
    }
}

// Every release build checks the GENERATED BuildConfig before compiling: the Aurelian allowlist that
// is compiled into the app must be exactly the approved one, or the build fails. The task declares
// no outputs, so it runs on every release build (never skipped as up to date).
def verifyAurelianReleaseAllowlist = tasks.register('verifyAurelianReleaseAllowlist') {
    dependsOn 'generateReleaseBuildConfig'
    def generatedDir = layout.buildDirectory.dir('generated/source/buildConfig/release')
    doLast {
        def files = fileTree(generatedDir) { include '**/com/goodlift/razorsedge/BuildConfig.java' }.files
        String compiled = null
        if (files.size() == 1) {
            def m = files.iterator().next().text =~ /AURELIAN_CALLER_CERTS = "([^"]*)"/
            if (m.find()) compiled = m.group(1)
        }
        if (compiled != APPROVED_AURELIAN_RELEASE_CERTS) {
            throw new GradleException("Release BuildConfig.AURELIAN_CALLER_CERTS is '${compiled}', expected the approved " +
                "Aurelian certificate ${APPROVED_AURELIAN_RELEASE_CERTS} (android/app/build.gradle).")
        }
        logger.lifecycle("Aurelian release allowlist verified: ${compiled}")
    }
}
tasks.matching { it.name in ['compileReleaseKotlin', 'compileReleaseJavaWithJavac'] }.configureEach {
    dependsOn verifyAurelianReleaseAllowlist
}



flutter {
    source = "../.."
}

dependencies {
    // ✅ Force AndroidX Core into all build variants
    implementation "androidx.core:core:1.13.1"
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "com.google.android.material:material:1.11.0"

    // JVM unit tests of the Aurelian voice bridge core (android/app/src/test).
    testImplementation "junit:junit:4.13.2"
}
