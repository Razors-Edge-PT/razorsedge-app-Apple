pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        file("local.properties").withInputStream { properties.load(it) }
        def flutterSdkPath = properties.getProperty("flutter.sdk")
        assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
        return flutterSdkPath
    }()

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    id "com.android.application" version "8.11.1" apply false
    id "com.android.library"     version "8.11.1" apply false
    id "org.jetbrains.kotlin.android" version "2.2.20" apply false
    id "com.google.gms.google-services" version "4.4.2" apply false
}


include ":app"

// ✅ Patch: give all Android library subprojects (e.g. isar_flutter_libs) a fallback namespace if missing
gradle.afterProject { p ->
    if (p.plugins.hasPlugin("com.android.library")) {
        def androidExt = p.extensions.findByName("android")
        if (androidExt != null && !androidExt.hasProperty("namespace")) {
            androidExt.namespace = "fallback.${p.name.replace('-', '_')}"
            println "⚠️ Added fallback namespace to ${p.name}: ${androidExt.namespace}"
        }
    }
}
